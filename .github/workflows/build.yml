name: "Build Dopamine roothide (DeveloperMode Patch)"

on:
  workflow_dispatch:
    inputs:
      build_tipa:
        description: 'Build TIPA (signed IPA for TrollStore)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\\s*)(get_sdks)\s*$/\\1mkdir -p \\${THEOS}\\\/sdks\\n\\1touch \\${THEOS}\\\/sdks\\\/sdk\\n\\1\\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Version Info
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Build Dopamine
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          
          # Add builder credit
          plutil -insert items.4 -xml "<dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>BUILDER</string></dict>" ./Application/Dopamine/UI/Settings/Credits.plist 2>/dev/null || true
          plutil -insert items.5 -xml "<dict><key>cell</key><string>PSGroupCell</string><key>headerCellClass</key><string>DOCreditsCell</string><key>names</key><array><dict><key>name</key><string>Maurice</string><key>link</key><string>https://github.com/Maurice</string></dict></array></dict>" ./Application/Dopamine/UI/Settings/Credits.plist 2>/dev/null || true
          
          # Build
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1
          
          # Get version
          APP_VERSION="$(cat ./BaseBin/_external/basebin/.version)-$(cat ./BaseBin/_external/basebin/.version-roothide)"
          VERSION="(${APP_VERSION}-${{ env.shorthash }})-$(TZ=UTC git show -s --date=format-local:'%Y.%m.%d-%Z-%H.%M.%S' --format='%cd' HEAD)"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Rename Artifacts
        run: |
          set -x
          cd ./Application
          mv "Dopamine-roothide-${{ env.version }}.ipa" "roothide-Dopamine-${{ env.version }}-DEVMOde-FIX.ipa" 2>/dev/null || true
          mv "Dopamine-roothide-${{ env.version }}.tipa" "roothide-Dopamine-${{ env.version }}-DEVMOde-FIX.tipa" 2>/dev/null || true
          ls -la

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-IPA
          path: ./Application/roothide-Dopamine-*-DEVMOde-FIX.ipa
          if-no-files-found: warn

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        if: ${{ inputs.build_tipa }}
        with:
          name: Dopamine-TIPA
          path: ./Application/roothide-Dopamine-*-DEVMOde-FIX.tipa
          if-no-files-found: warn
